<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1324"><link rel="manifest" href="./manifest.webmanifest"><title>Health Archive v0.7</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;background:#0b1324;color:#ecf4ff}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:780px;margin:auto;padding:25px 15px 112px}.eyebrow{color:#8cabc8;font-size:11px;letter-spacing:.14em}h1{font-size:29px;margin:9px 0}h2{font-size:19px;margin:24px 0 12px}.muted,.date{color:#9fb4ce;font-size:12px}.banner{background:#193047;border:1px solid #37546f;border-radius:14px;padding:13px;margin:14px 0;line-height:1.55;font-size:12px}.error{color:#ffd1d1;border-color:#b66b6b}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card,.item{background:#15253b;border:1px solid #314963;border-radius:16px;padding:14px;min-width:0}.metric{font-size:28px;font-weight:750;overflow-wrap:anywhere;margin:8px 0}.label{color:#a6bed6;font-size:12px}.list{display:grid;gap:9px}.item{display:flex;justify-content:space-between;gap:10px;align-items:center}.item strong{font-size:14px}.value{text-align:right;font-weight:700;overflow-wrap:anywhere}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;padding:7px 4px calc(7px + env(safe-area-inset-bottom));background:#101c30f5;border-top:1px solid #2b3e59;z-index:10}.nav button{background:none;color:#9fb4ce;border:0;flex:1;max-width:150px;padding:8px 1px;font-size:12px}.nav .active{color:#6de0d0;font-weight:750}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.btn{background:#264c66;color:#f0faff;border:1px solid #4a7490;border-radius:11px;padding:11px 13px;font-size:13px}.primary{background:#5cd2c0;color:#08272b;border:0;font-weight:750}.danger{background:#5a303d;border-color:#a95a65;color:#ffd5d5}.field{display:grid;gap:5px;margin:12px 0}.field label{font-size:12px;color:#b4c9df}input,select{width:100%;min-width:0;background:#0b1729;color:#f2f8ff;border:1px solid #496b88;border-radius:10px;padding:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.hidden{display:none!important}.chart{width:100%;height:auto;display:block}.empty{padding:22px;text-align:center;color:#adc0d5}.pill{background:#224e51;color:#9cf5e6;border-radius:20px;padding:5px 9px;font-size:11px}.small{font-size:12px;line-height:1.65}.notice{font-size:12px;color:#c1d4e8;line-height:1.65}#toast{position:fixed;bottom:98px;left:6%;width:88%;z-index:30;background:#3b5a70;color:#fff;border-radius:12px;padding:12px;text-align:center;display:none}svg text{font-family:-apple-system,sans-serif}
</style></head><body><main class="shell"><div class="eyebrow">PERSONAL HEALTH INTELLIGENCE</div><h1>Health Archive <span style="color:#68e0ca">●</span></h1><div class="muted">あなたの健康記録をiPhone内に保存</div><div class="banner">v0.7 · アプリ本体に健康データは含みません。「設定」から初期JSONを読み込んでください。原本未照合データは医療判断に利用しないでください。</div><div id="alert"></div><div id="view"></div></main><nav id="nav" class="nav"></nav><div id="toast"></div><script>
'use strict';
const el=id=>document.getElementById(id);
const esc=x=>String(x===null||x===undefined?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blank=()=>({app:'Health Archive',schema_version:'0.2',observations:[],medication_periods:[],findings:[],imaging_studies:[],health_events:[],documents:[],encounters:[],marker_definitions:[],interpretations:[],audit_logs:[],settings:[]});
const tabs=[['home','⌂','ホーム'],['trends','⌁','推移'],['history','▤','履歴'],['meds','✚','薬歴'],['settings','⚙','設定']];
const state={tab:'home',data:blank(),marker:'',search:'',editing:null,errors:[]};let db;
function norm(x){return String(x||'').toLowerCase().replace(/[\s_　％%・（）()\-]/g,'')}
function canonical(x){let k=norm(x);if(['hba1c','ヘモグロビンa1c','グリコヘモグロビン'].includes(k))return 'HbA1c';if(k==='egfr')return 'eGFR';if(['ldl','ldlc','ldlコレステロール'].includes(k))return 'LDL';if(['cpk','ck','クレアチンキナーゼ'].includes(k))return 'CPK';return String(x||'')}
function obs(){return Array.isArray(state.data.observations)?state.data.observations:[]}
function nval(o){let x=o.numeric_value;return typeof x==='number'&&Number.isFinite(x)?x:(typeof x==='string'&&x.trim()!==''&&Number.isFinite(Number(x))?Number(x):null)}
function value(o){return o.raw_text!==null&&o.raw_text!==undefined&&o.raw_text!==''?o.raw_text:(o.categorical_value??o.numeric_value??'—')}
function showError(e){let msg=String(e&&e.message?e.message:e);state.errors.push(msg);el('alert').innerHTML='<div class="banner error">エラー：'+esc(msg)+'</div>';notify('エラーが発生しました')}
function notify(t){let a=el('toast');a.textContent=t;a.style.display='block';setTimeout(()=>a.style.display='none',2600)}
function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open('health-archive-v04',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('store'))r.result.createObjectStore('store')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function dbRead(){return new Promise((resolve,reject)=>{let r=db.transaction('store','readonly').objectStore('store').get('data');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function dbWrite(x){return new Promise((resolve,reject)=>{let t=db.transaction('store','readwrite');t.objectStore('store').put(x,'data');t.oncomplete=resolve;t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error)})}
function validate(x){if(!x||!Array.isArray(x.observations))throw Error('observations配列がありません');for(let i=0;i<x.observations.length;i++){let o=x.observations[i];if(!o||!o.marker_id||!o.date)throw Error((i+1)+'件目の項目名または日付がありません')}return {...blank(),...x,observations:x.observations,medication_periods:Array.isArray(x.medication_periods)?x.medication_periods:[],findings:Array.isArray(x.findings)?x.findings:[],audit_logs:Array.isArray(x.audit_logs)?x.audit_logs:[]}}
async function save(x){let d=validate(x);await dbWrite(d);state.data=d}
function latest(name){return obs().filter(o=>canonical(o.marker_id)===name).sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0]}
function line(o,editable){return `<div class="item"><div style="min-width:0"><strong>${esc(canonical(o.marker_id))}</strong><div class="date">${esc(o.date)} · ${esc(o.verification_status==='verified'?'原本確認済み':'未照合／手入力')}</div></div><div class="value">${esc(value(o))}<div class="date">${esc(o.unit||'')}</div>${editable?`<div class="toolbar" style="justify-content:flex-end"><button class="btn" data-edit="${esc(o.id)}">編集</button><button class="btn danger" data-delete="${esc(o.id)}">削除</button></div>`:''}</div></div>`}
function render(){try{el('alert').innerHTML='';el('nav').innerHTML=tabs.map(([id,ic,label])=>`<button data-tab="${id}" class="${state.tab===id?'active':''}"><div style="font-size:22px">${ic}</div>${label}</button>`).join('');el('nav').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});if(state.tab==='home')home();if(state.tab==='trends')trends();if(state.tab==='history')history();if(state.tab==='meds')meds();if(state.tab==='settings')settings()}catch(e){showError(e)}}
function home(){let recent=obs().slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,8);el('view').innerHTML=`<h2>最新の指標 <span class="pill">${obs().length}件</span></h2><div class="grid">${['HbA1c','eGFR','LDL','CPK'].map(m=>{let o=latest(m);return `<div class="card"><div class="label">${m}</div><div class="metric">${esc(o?value(o):'—')}</div><div class="date">${esc(o?.unit||'')} · ${esc(o?.date||'記録なし')}</div></div>`}).join('')}</div><h2>最近の検査結果</h2><div class="list">${recent.map(o=>line(o,false)).join('')||'<div class="empty">検査データがありません</div>'}</div>`}
function trends(){let markers=[...new Set(obs().map(o=>canonical(o.marker_id)))].sort((a,b)=>a.localeCompare(b,'ja'));if(!markers.includes(state.marker))state.marker=markers.includes('HbA1c')?'HbA1c':(markers[0]||'');let a=obs().filter(o=>canonical(o.marker_id)===state.marker&&nval(o)!==null).sort((x,y)=>String(x.date).localeCompare(String(y.date)));let graph='<div class="empty">数値データがありません</div>';if(a.length){let ys=a.map(nval),lo=Math.min(...ys),hi=Math.max(...ys),pad=Math.max((hi-lo)*.18,0.5);lo-=pad;hi+=pad;let pts=a.map((o,i)=>[42+i*300/Math.max(a.length-1,1),168-(nval(o)-lo)/(hi-lo)*124]);graph=`<svg class="chart" viewBox="0 0 380 210" role="img" aria-label="${esc(state.marker)}の推移"><line x1="38" y1="169" x2="350" y2="169" stroke="#58718d"/><polyline points="${pts.map(p=>p.join(',')).join(' ')}" stroke="#68dfca" stroke-width="3" fill="none"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#98f5e4"/>`).join('')}<text x="40" y="22" fill="#c4d6e8" font-size="12">最大 ${Math.max(...ys)}</text><text x="40" y="194" fill="#c4d6e8" font-size="11">${esc(a[0].date)}</text><text x="247" y="207" fill="#c4d6e8" font-size="11">${esc(a[a.length-1].date)}</text></svg>`}el('view').innerHTML=`<h2>検査値の推移</h2><div class="field"><label>検査項目</label><select id="marker">${markers.map(m=>`<option value="${esc(m)}" ${m===state.marker?'selected':''}>${esc(m)}</option>`).join('')}</select></div><div class="card">${graph}<div class="muted">${a.length}件の数値データ</div></div><h2>測定履歴</h2><div class="list">${a.slice().reverse().map(o=>line(o,false)).join('')}</div>`;if(el('marker'))el('marker').onchange=e=>{state.marker=e.target.value;render()}}
function history(){let a=obs().filter(o=>(String(o.marker_id)+' '+String(o.date)).toLowerCase().includes(state.search.toLowerCase())).sort((x,y)=>String(y.date).localeCompare(String(x.date)));el('view').innerHTML=`<h2>検査履歴</h2><input id="search" placeholder="検査項目・日付で検索" value="${esc(state.search)}"><div class="toolbar"><button id="add" class="btn primary">＋ 新規登録</button></div><div id="form" class="card hidden"><h2 id="formTitle">検査結果を登録</h2><div class="field"><label>検査日</label><input id="date" type="date"></div><div class="field"><label>項目</label><input id="name" placeholder="HbA1c"></div><div class="two"><div class="field"><label>結果</label><input id="result" placeholder="6.0"></div><div class="field"><label>単位</label><input id="unit" placeholder="%"></div></div><div class="toolbar"><button id="save" class="btn primary">保存</button><button id="cancel" class="btn">キャンセル</button></div></div><p class="muted">${a.length}件 / 全${obs().length}件</p><div class="list">${a.map(o=>line(o,true)).join('')}</div>`;el('search').onchange=e=>{state.search=e.target.value;render()};el('add').onclick=()=>edit(null);el('save').onclick=saveRecord;el('cancel').onclick=()=>el('form').classList.add('hidden');el('view').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));el('view').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>remove(b.dataset.delete))}
function edit(id){state.editing=id;let o=obs().find(x=>String(x.id)===String(id));el('form').classList.remove('hidden');el('formTitle').textContent=o?'検査結果を編集':'検査結果を登録';el('date').value=o?.date||'';el('name').value=o?.marker_id||'';el('result').value=o?String(value(o)):'';el('unit').value=o?.unit||'';el('form').scrollIntoView({block:'nearest'})}
async function saveRecord(){try{let date=el('date').value,name=el('name').value.trim(),raw=el('result').value.trim(),unit=el('unit').value.trim();if(!date||!name||!raw){notify('日付・項目・結果を入力してください');return}let x=JSON.parse(JSON.stringify(state.data)),i=x.observations.findIndex(o=>String(o.id)===String(state.editing)),prior=i>=0?x.observations[i]:null;let numeric=/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(raw)?Number(raw):null;let record={...(prior||{}),id:prior?.id||('manual-'+Date.now()),date,marker_id:name,raw_text:raw,numeric_value:numeric,categorical_value:numeric===null?raw:null,unit,verification_status:'user_entered',source_type:'manual'};if(i<0)x.observations.push(record);else x.observations[i]=record;x.audit_logs.push({at:new Date().toISOString(),action:i<0?'create':'update',id:record.id,previous:prior});await save(x);state.editing=null;render();notify('保存しました')}catch(e){showError(e)}}
async function remove(id){if(!confirm('この検査結果を削除しますか？'))return;try{let x=JSON.parse(JSON.stringify(state.data)),prior=x.observations.find(o=>String(o.id)===String(id));x.observations=x.observations.filter(o=>String(o.id)!==String(id));x.audit_logs.push({at:new Date().toISOString(),action:'delete',id,previous:prior});await save(x);render();notify('削除しました')}catch(e){showError(e)}}
function meds(){let m=state.data.medication_periods||[],f=state.data.findings||[];el('view').innerHTML=`<h2>薬歴</h2><div class="list">${m.map(x=>`<div class="item"><div><strong>${esc(x.drug)}</strong><div class="date">${esc(x.frequency||'')} · ${esc(x.status||'')}</div></div><div class="value">${esc(x.dose??'')} ${esc(x.dose_unit||'')}</div></div>`).join('')||'<div class="empty">記録なし</div>'}</div><h2>画像所見</h2><div class="list">${f.map(x=>`<div class="item"><div><strong>${esc(x.anatomy||x.modality||'所見')}</strong><div class="date">${esc(x.date||'日付未確定')}</div><div class="small">${esc(x.finding_text||'')}</div></div></div>`).join('')||'<div class="empty">記録なし</div>'}</div><p class="notice">薬歴と所見は現時点では閲覧専用です。</p>`}
function settings(){el('view').innerHTML=`<h2>データ管理</h2><div class="card"><div class="label">保存中の検査結果</div><div class="metric">${obs().length}件</div><div class="toolbar"><button id="export" class="btn primary">JSONバックアップ</button><button id="import" class="btn">JSON読み込み</button><input id="file" class="hidden" type="file" accept=".json,application/json"></div><div class="notice">読み込みは既存データを置き換えます。バックアップ後に実行してください。</div></div><h2>診断情報</h2><div class="card small">バージョン：0.7<br>データ件数：${obs().length}<br>接続：${navigator.onLine?'オンライン':'オフライン'}<br>表示モード：${window.matchMedia('(display-mode: standalone)').matches?'ホーム画面アプリ':'Safari等'}<br>直近のエラー：${esc(state.errors.slice(-1)[0]||'なし')}<div class="toolbar"><button id="verify" class="btn">保存件数を確認</button></div></div><div class="banner">個人の検査JSONを公開GitHubへアップロードしないでください。iCloud Drive等へ定期的にバックアップしてください。</div>`;el('export').onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify(state.data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='health-archive-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),15000)};el('import').onclick=()=>el('file').click();el('file').onchange=async e=>{try{let f=e.target.files?.[0];if(!f)return;let x=validate(JSON.parse(await f.text()));if(!confirm(x.observations.length+'件を読み込みます。現在のデータを置き換えてよいですか？'))return;await save(x);state.marker='';state.search='';render();el('alert').innerHTML='<div class="banner">読み込み成功：'+obs().length+'件</div>';notify('読み込み成功')}catch(err){showError(err)}};el('verify').onclick=async()=>{try{let x=await dbRead();notify('保存件数：'+(x?.observations?.length??0)+'件')}catch(e){showError(e)}}}
(async()=>{try{db=await openDB();let x=await dbRead();state.data=x?validate(x):blank();if(!x)await dbWrite(state.data);render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(e=>console.warn(e))}catch(e){showError(e);el('view').innerHTML='<div class="banner error">初期化できませんでした。再読み込みしてください。</div>'}})();
</script></body></html>
