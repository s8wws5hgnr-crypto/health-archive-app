function distanceToRange(x,r){return (r.low!==null&&x<r.low)?r.low-x:(r.high!==null&&x>r.high)?x-r.high:0}
function trendFor(name){const records=dateObs(name);if(!records.length)return {cls:'tag-neutral',label:'判定データなし',delta:'記録なし'};
 const o=records[records.length-1],p=records.length>1?records[records.length-2]:null,r=rangeFor(name,o),now=nval(o);
 const hasRange=!!(r&&(r.low!==null||r.high!==null));
 const inRange=hasRange&&distanceToRange(now,r)===0;
 if(!p)return {cls:inRange?'tag-good':'tag-neutral',label:inRange?'✓ 基準範囲内':'前回データなし',delta:'比較できる前回値なし'};

 if(inRange){let wasOutside=distanceToRange(prev,r)>0;return {cls:'tag-good',label:wasOutside?'↗ 基準範囲へ改善':'✓ 基準範囲内',delta}}

const HEALTH_DETAILS={"hba1c":{"mechanism":"赤血球のヘモグロビンにブドウ糖が結びついた割合です。赤血球が血中に存在する期間にわたり糖が付着するため、採血当日の血糖ではなく過去約2〜3か月の平均的な状態を反映します。特に直近数週間の変化も比較的大きく影響します。","high":"高値が続くほど、長期的には網膜・腎臓・神経などの合併症リスクが高まる傾向があります。ただし数値だけで合併症の有無は分かりません。糖尿病治療中は検査機関の基準範囲より、主治医と決めた治療目標を優先します。","low":"低い値は必ずしも危険ではありません。しかし血糖を下げる薬によっては、低血糖を繰り返していないか確認が必要です。溶血、出血、輸血、貧血の一部など赤血球の寿命が変化する状況では、血糖の実態より低く出る場合があります。","reading":"空腹時血糖・食後血糖・服薬状況とセットで見ると情報が増えます。短期間の食事や運動だけで即日変わる指標ではなく、数か月単位の推移が中心です。HbA1cが良好でも、低血糖や食後の大きな上昇は完全には分かりません。"},"glucose":{"mechanism":"血液中を流れているブドウ糖の濃度です。脳や筋肉などのエネルギー源で、インスリンや肝臓の働きによって調節されます。HbA1cと違い、採血した「その瞬間」を反映します。","high":"高値の背景には食事直後、感染症、ストレス、薬剤、インスリン作用の不足などがあります。空腹時の高値が繰り返される場合と、食後に一時的に高い場合は意味が異なるため、採血条件の記録が重要です。","low":"低値は長時間の空腹、激しい運動、血糖降下薬などで起こり得ます。冷汗・ふるえ・動悸・ぼんやりするなどの症状があれば低血糖を疑います。意識障害を伴う低血糖は緊急対応が必要です。","reading":"空腹時か食後何時間か、運動・食事・服薬の時刻を併記して比較します。HbA1cが低めでも、一日のうちに血糖が大きく変動していることがあります。条件が違う2回の採血値をそのまま「改善・悪化」とは判定しません。"},"tg":{"mechanism":"中性脂肪（トリグリセリド）は、使い切れなかったエネルギーを貯蔵する脂質です。血液中では食事由来の脂質や肝臓が作る脂質が運ばれ、糖分・飲酒・食後時間の影響を受けます。","high":"高値が長く続くと、他の危険因子とともに動脈硬化リスクに関係します。非常に高い場合には急性膵炎のリスクが問題になります。糖代謝の乱れ、飲酒、体重変化、遺伝的な要因、薬剤など原因は一つではありません。","low":"低値は食事量が少ない、低栄養などでみられることがありますが、症状がなく適切な栄養状態であれば単独で大きな問題とは限りません。「低ければ低いほど良い」と決めつける項目ではありません。","reading":"空腹採血と食後採血で結果が大きく異なるため、同じ条件で比較します。LDL・HDL・HbA1c、体重や飲酒量と一緒に追うと生活要因が見えやすくなります。急な上昇はまず採血条件を確認します。"},"hdl":{"mechanism":"HDLは余分なコレステロールを末梢から肝臓へ運ぶ働きに関係する粒子です。「善玉」と呼ばれますが、実際の心血管リスクはLDLや血圧、糖尿病の有無など複数要因で決まります。","high":"極端に高いHDLが必ずしも心血管を強く守るわけではありません。高値であってもLDLが高い場合などにはリスク管理が必要です。HDLの数値だけを上げる治療は一般に主な目標ではありません。","low":"低HDLは運動不足、喫煙、肥満、インスリン抵抗性、高TGなどと関連します。低いこと自体は総合的な心血管リスクの手がかりであり、別の指標も同時に確認します。","reading":"LDL・中性脂肪・血圧・HbA1cと合わせて読みます。運動などによりHDLが少し変わっても、それだけで血管が改善したとは断定できません。検査間隔や全体のリスク低下を優先して考えます。"},"ldl":{"mechanism":"LDLはコレステロールを肝臓から体の組織へ運ぶ粒子で、多すぎると血管壁に蓄積して動脈硬化の原因になります。必要な物質を運ぶ役割もありますが、過剰な濃度が長期間続くことが問題です。","high":"高値が続くほど心筋梗塞や脳梗塞などのリスクに関与します。糖尿病、喫煙、血圧、腎機能、家族歴、過去の心血管疾患によって目標値は異なります。検査票の正常範囲だけでは個別の管理目標を判断できません。","low":"非常に低い値は薬の効果による場合もあり、通常は単独で危険を意味しません。ただし急な変化や食事量の低下などがあれば背景を確認します。自己判断による脂質低下薬の中止は避けます。","reading":"中性脂肪が非常に高い場合、計算式で求めたLDLは精度が下がることがあります。治療中なら服薬継続、食事の脂質の質、家族歴などを含めて長期で確認します。「基準内＝治療目標達成」とは限りません。"},"egfr":{"mechanism":"eGFRは、血液中のクレアチニンなどから腎臓の「ろ過能力」を推定した値です。単位は通常mL/分/1.73m²で、腎臓が血液をどの程度ろ過できるかを年齢や体格等の情報を用いて計算します。直接測った腎機能ではありません。","high":"eGFRが高いことは多くの場合良好ですが、血糖が著しく高い時期などに「過剰ろ過」が起きる場合もあります。そのため単に高ければ高いほど良いとは言えず、推移と背景が大切です。","low":"低めの値が続く場合は腎機能の低下を検討します。ただし60〜89の値だけで慢性腎臓病と確定するわけではありません。尿アルブミンや尿蛋白、画像所見などの腎障害所見、3か月以上の持続性と合わせて判断します。","reading":"筋肉量、採血前の運動・食事、脱水、薬剤による一時的な変化があり得ます。SGLT2阻害薬などで治療開始後に一時的なeGFR低下がみられる場合もあります。尿アルブミン/Cr比と並べて観察し、必要ならシスタチンC測定について相談します。"},"cr":{"mechanism":"クレアチニン（Cr）は筋肉の代謝から一定量生じ、主に腎臓から排泄される物質です。腎臓のろ過能力を推定するeGFRの計算に使われますが、筋肉量が多い人は腎臓が正常でも高めになり得ます。","high":"高値の原因として、腎臓からの排泄低下のほか、脱水、激しい運動、筋肉量や一部薬剤などが挙げられます。数値が急速に上がる場合は単回の「基準範囲内外」以上に経過が重要になります。","low":"低値は筋肉量が少ない、低栄養などで起こり得ます。低いこと自体が必ずしも良い腎機能を示すわけではなく、筋肉量が少ないとクレアチニンから計算するeGFRが実態より高く出ることがあります。","reading":"同じ検査法での経時変化、eGFR、尿アルブミン/Cr比、血圧、体重を合わせてみます。運動や筋肉痛の直後に測った場合は記録を残し、変化の解釈を医師に確認することが有用です。"},"uacr":{"mechanism":"尿アルブミン/クレアチニン比（UACR）は、尿中のアルブミン量を尿中クレアチニン量で補正した指標です。尿の濃さによる影響をある程度補正し、早期の腎臓の変化を捉えるために使います。","high":"一般に30mg/gCr以上が繰り返しみられるとアルブミン尿を疑い、糖尿病や高血圧に伴う腎障害の評価に役立ちます。高値1回だけでは確定せず、尿路感染や運動直後など一時的要因を除いて再確認します。","low":"低値または測定限界以下は通常良好な所見です。ただしUACRが低いことだけで、すべての腎疾患がないとは言い切れません。eGFRや尿所見・画像所見も確認します。","reading":"eGFRとUACRは腎機能と腎損傷を別の角度から見るため、セットで重要です。激しい運動、発熱、感染症、血糖・血圧の一時的な上昇などで変動する場合があります。検査日ごとの条件も記録します。"},"uric":{"mechanism":"尿酸は体内のプリン体が分解されると生じる物質で、主に腎臓や腸から排泄されます。血液中で高濃度が続くと尿酸塩の結晶ができ、痛風や尿路結石に関係することがあります。","high":"高尿酸血症は痛風、結石、腎機能・代謝の状態を評価する手がかりです。飲酒、果糖の多い飲料、急激な減量、遺伝、排泄能力や薬剤などが影響します。無症状の高値への対応は合併症の有無によって異なります。","low":"低尿酸は栄養状態、薬剤、尿酸排泄が多い体質などでみられます。極端な低値や繰り返す異常があるときには別途評価が必要になることがありますが、単回の軽い低下だけで判断しません。","reading":"急な関節の痛み・腫れ、過去の結石歴、水分摂取や腎機能の変化も合わせて見ます。尿酸だけを短期的に下げるための断食や過度な減量は逆効果になり得ます。"},"ast":{"mechanism":"ASTは肝臓・筋肉・心筋などの細胞に含まれる酵素です。細胞に負担や損傷が加わると血液中に増えることがあり、ALTと並ぶ肝関連検査として使われます。AST単独ではどの臓器が原因か断定できません。","high":"高値は肝炎、脂肪肝、飲酒、薬剤の影響などで起こり得ますが、激しい運動や筋肉の損傷によっても上昇します。ASTだけが高い場合は、筋肉由来かを考えるためCK（CPK）も参考になります。","low":"低値は多くの場合、病的な意味を持たないことが多く、「低いほど肝臓が健康」という指標ではありません。","reading":"ALT・γ-GTP・ビリルビン・CKとセットで確認します。AST/ALT比だけから病名を決めるのは避け、直近の運動・飲酒・服薬や症状とともに推移を見ます。"},"alt":{"mechanism":"ALTは主に肝細胞に含まれる酵素で、肝細胞に負担がかかると血液中に増えます。ASTより肝臓との関連が比較的強い指標ですが、ALTが正常でもすべての肝疾患を否定できるわけではありません。","high":"高値は脂肪肝（MASLD）、肝炎、薬剤性の影響などを考える手がかりです。強い運動でも変動し得ます。高値の程度だけで病気の重症度や肝臓の線維化の程度を推測することはできません。","low":"低い値は通常大きな問題とは限りません。栄養状態やビタミンB6不足などが影響する例もありますが、無症状で単回の低値なら他の情報と合わせて判断します。","reading":"AST・γ-GTP、腹部超音波などの画像検査、血糖・脂質・体重との関連を見ることが重要です。脂肪肝がある場合、ALTが下がっても画像所見や線維化リスクが必ず改善したとは限りません。"},"ggtp":{"mechanism":"γ-GTP（GGT）は肝臓や胆道系に関係する酵素です。胆汁の流れに問題がある場合や飲酒・一部の薬剤などの影響を受け、肝胆道系の検査で使われます。","high":"高値は飲酒、脂肪肝、肝胆道系の病気、薬剤など複数の要因で起こり得ます。γ-GTPだけが高い場合と、ALP・ビリルビンなども高い場合では評価の方向性が異なります。","low":"低値は多くの場合、病的な意味が乏しく、数値を上げる必要はありません。","reading":"AST・ALTに加えてALP・ビリルビン、服薬・飲酒・腹部エコーを組み合わせます。高い数値でも原因がアルコールとは限らず、飲酒歴のみで決めつけません。"},"cpk":{"mechanism":"CK（CPK）は骨格筋・心筋などの細胞に多く含まれる酵素です。筋肉を強く使ったときや筋線維が傷ついたとき、血中に漏れ出て増加することがあります。","high":"高値は激しいランニング、筋トレ、筋肉痛、注射、薬剤、筋疾患などでみられます。数値のみでは横紋筋融解症を診断できません。筋肉痛・脱力・尿色・腎機能などと合わせて判断します。","low":"低値は筋肉量が少ない場合などにみられますが、一般には高値ほど臨床上の関心は高くありません。低ければ低いほど良いという指標ではありません。","reading":"運動から採血までの時間・負荷・筋肉痛を一緒に記録してください。スタチン等の薬を使っていて筋肉痛・脱力が続く場合は医師に伝えます。強い症状や赤褐色尿を伴う場合は早めの評価が必要です。"},"bmi":{"mechanism":"BMIは体重(kg)を身長(m)の2乗で割った体格指標です。計算が簡単で集団的な健康リスク評価に使われますが、筋肉と脂肪の区別はできません。","high":"高いBMIは体脂肪が多い可能性を示しますが、筋肉量の多い人でも上がります。肥満に関連した健康リスクの評価では腹囲・血圧・血糖・脂質もあわせて見ます。","low":"低いBMIは栄養不足や筋肉量不足につながる場合があります。一方で体質的に細身の人もいるため、体調や意図しない体重減少の有無を重視します。","reading":"同じBMIでも腹囲や体脂肪分布で代謝リスクは異なります。数値を「目標範囲」に機械的に合わせるのではなく、筋力、食事量、健康診断結果の推移も考慮します。"},"weight":{"mechanism":"体重は脂肪・筋肉・骨・体内水分などを含む全身の重さです。短期間では水分や便通、塩分量だけでも変わるため、1日の増減で脂肪量の変化を判断できません。","high":"体重増加の背景には筋肉量増加、脂肪増加、体液貯留などがあります。急な増加にむくみや息切れを伴う場合と、数か月かけて徐々に増える場合では評価が異なります。","low":"体重減少には意図した運動・食事調整による変化のほか、脱水、病気、栄養不足などもあります。特に意図しない急な減少は医療機関で確認が必要になることがあります。","reading":"朝起床後・排尿後など同条件で測り、1〜4週間程度の傾向を見ます。腹囲・BMI・運動量・食事内容と合わせることで、体重の数字だけでは分からない変化を理解できます。"},"waist":{"mechanism":"腹囲はおなか周りの長さで、内臓脂肪の蓄積を推定する材料の一つです。BMIが標準域でも内臓脂肪が多い場合があるため、体重とは別に見る意味があります。","high":"大きい腹囲が続く場合、血圧・脂質・血糖などのリスクと関連することがあります。ただし腹囲は脂肪量の直接測定ではなく、筋肉や体格、測定位置にも左右されます。","low":"腹囲が小さいこと自体が問題とは限りませんが、意図しない体重減少、食事不足などがある場合は全身状態を確認します。","reading":"検査機関によって測定位置が違うことがあります。へその高さ、姿勢、呼吸の状態を統一し、体重・BMI・HbA1c・TGとの長期的な変化をあわせて見ます。"},"height":{"mechanism":"身長は体の長さを表し、BMIなどを計算する基礎データです。成人では通常、大きく変動しないため、健康改善のために上下させる対象ではありません。","high":"測定値が以前より大きくなっても、成人では姿勢・測定方法・機器の違いで説明されることがあります。病的な原因を身長の上昇だけから判断しません。","low":"明らかな身長低下が続く場合、姿勢変化や脊椎の状態などの評価が必要になることがあります。ただし1cm程度の差には時刻や姿勢なども影響します。","reading":"朝と夕方では椎間板などの影響で少し差が出ることがあります。靴を脱ぎ、背筋を伸ばし、同条件で測って比較します。BMIが大きく変わった場合は身長の転記ミスも確認します。"},"sbp":{"mechanism":"収縮期血圧は、心臓が収縮して血液を送り出した瞬間の動脈の圧力で「上の血圧」と呼ばれます。血管や心臓への負荷を考える重要な指標です。","high":"繰り返し高い場合は心血管・腎臓のリスク評価が必要です。緊張、運動直後、カフェイン、測定姿勢などでも一時的に高くなるため、診察室の1回だけで結論を出しません。","low":"低い場合は体質のこともありますが、めまい・ふらつき・失神を伴う場合は脱水や薬剤などを含めて評価します。症状のない低めの数値を無理に上げる必要は通常ありません。","reading":"家庭では背もたれのある椅子で数分安静にし、腕の高さとカフ位置をそろえて測ります。朝晩の複数回記録の平均、拡張期血圧、服薬の有無を確認します。家庭と診察室では目安が異なります。"},"dbp":{"mechanism":"拡張期血圧は心臓が次の拍動に向けて広がっているときの動脈圧で「下の血圧」です。収縮期血圧と合わせて心血管系への負担を評価します。","high":"高値が持続する場合は高血圧の評価対象です。年齢・血管の性質・測定条件などで変化し、収縮期と拡張期のどちらが問題かで治療方針も異なることがあります。","low":"低値は体質や薬剤・脱水などで起こり得ます。特にめまい、失神、胸痛を伴う場合は適切な評価が必要です。","reading":"上の血圧とセットで、同じ姿勢と時刻で測ります。単発の値より数日〜数週間の平均を重視し、家庭血圧と診察室の血圧の差も記録しておくと役立ちます。"},"urineglucose":{"mechanism":"尿糖は、血液中のブドウ糖が腎臓の再吸収能力を超えるか、薬剤などで再吸収が抑えられたときに尿へ排出された糖を検出します。血糖を直接測定する検査ではありません。","high":"尿糖陽性は高血糖が原因となることがありますが、SGLT2阻害薬（例：ジャディアンス）を服用中は血糖が良好でも陽性になり得ます。尿糖3+だから糖尿病が悪化していると直結させてはいけません。","low":"陰性でも食後高血糖や糖尿病を完全には否定できません。尿糖が出る血糖値には個人差があるため、尿糖単独で血糖コントロールを評価しません。","reading":"HbA1cや血糖値、服薬内容と合わせて確認します。SGLT2阻害薬使用中で食欲不振、吐き気、腹痛、息苦しさがある場合、血糖が高くなくてもケトアシドーシスの可能性があり、迅速な医療評価が必要です。"},"urineprotein":{"mechanism":"尿蛋白は、通常は尿に大量に漏れないたんぱく質が尿に出ていないかを見る検査です。腎臓のフィルターの状態を知る手がかりで、試験紙検査では主にアルブミンに反応します。","high":"繰り返す陽性は腎臓の病気の評価につながりますが、激しい運動、発熱、尿の濃縮、尿路感染などでも一時的な陽性が出ることがあります。1回の陽性だけで腎臓病と断定しません。","low":"陰性は通常良好な結果ですが、試験紙では微量アルブミン尿を見逃す場合があります。糖尿病などで腎評価が必要な場合は、尿アルブミン/Cr比が重要です。","reading":"eGFR・尿アルブミン/Cr比・血圧と合わせて評価します。陽性が続く場合は採尿状況をそろえた再検査や定量検査の必要性を主治医に確認します。"},"wbc":{"mechanism":"白血球は、細菌・ウイルスなどに対する免疫反応や炎症に関係する血液細胞です。総数だけでなく、好中球・リンパ球などの種類（白血球分画）を調べると手がかりが増えます。","high":"高値は感染症、炎症、ストレス、喫煙、一部薬剤などで起こり得ます。強い感染症だけでなく、運動・緊張などの一時的な上昇もあるため、症状や分画が重要です。","low":"低値はウイルス感染、薬剤、骨髄の働き、体質などさまざまな原因があり得ます。特に強い低下と発熱の組み合わせでは、感染への対処が急がれることがあります。","reading":"発熱、服薬、検査した時期と一緒に確認し、白血球分画やCRPなどと組み合わせます。白血球数だけから病気の種類や重症度を決めることはできません。"},"rbc":{"mechanism":"赤血球は、ヘモグロビンを含んで酸素を肺から全身へ運ぶ細胞です。赤血球数はその個数を表し、Hb・ヘマトクリット・MCVなどとセットで貧血や血液濃縮を考える材料になります。","high":"高値は脱水による濃縮、喫煙、睡眠中の低酸素、体質などでみられます。赤血球数だけが高いのか、Hb・ヘマトクリットも高いのかで意味が変わります。","low":"低値は出血、鉄・ビタミン不足、慢性疾患などによる貧血でみられることがあります。ただし赤血球の大きさが異なる場合は、個数だけで貧血の程度を評価できません。","reading":"Hb・ヘマトクリット・MCV・鉄関連検査と合わせます。数値が軽度に変化したときは水分状態や検査施設の違いも考慮し、必要以上に増減を目標にしません。"},"hb":{"mechanism":"ヘモグロビン（Hb）は赤血球内のたんぱく質で、酸素を結びつけて全身へ運びます。貧血の程度を評価する中心的な検査の一つで、血糖の指標であるHbA1cとは全く別の項目です。","high":"高値は脱水による血液濃縮、喫煙、慢性的な低酸素などでみられます。値だけで脱水や病気を確定することはできず、赤血球数やヘマトクリットを合わせて見ます。","low":"低値は貧血の可能性を示し、出血、鉄不足、ビタミンB12・葉酸不足、慢性炎症など原因が幅広くあります。原因が異なれば対応も異なるため、自己判断で鉄剤を始めないことが重要です。","reading":"MCV・MCH・MCHC、フェリチンや鉄、必要ならビタミンB12などと合わせて原因を絞ります。疲労・息切れ・動悸などの症状を記録すると判断の助けになります。"},"hct":{"mechanism":"ヘマトクリット（Ht/Hct）は血液全体の体積のうち、赤血球が占める割合です。赤血球そのものの量だけでなく、血しょう（水分）の変化によっても上下します。","high":"高値は脱水などによる濃縮や赤血球が多い状態でみられます。Hb・赤血球数の変化も同じ方向かどうかを確認します。","low":"低値は貧血、出血、体液量の増加などでみられます。ヘマトクリットだけでは原因が分からないため、HbやMCVなどと合わせて判断します。","reading":"運動後や採血当日の水分状態にも注意して比較します。Hb・赤血球数とセットで時系列を追う方が、ヘマトクリット単独の上下より意味があります。"},"plt":{"mechanism":"血小板は、血管が傷ついたときに集まって出血を止める働きに関係する血液細胞です。数が多いか少ないかに加え、働きの状態や服薬によって出血・血栓のリスクは変わります。","high":"高値は炎症、感染症、鉄欠乏などに反応して起こる場合がある一方、骨髄の病気が関係する場合もあります。一度高いだけで原因は判断できません。","low":"低値は薬剤、感染症、免疫の問題、骨髄の働きなどさまざまな原因があります。著しい低値では鼻血、歯ぐきの出血、点状出血などに注意が必要です。","reading":"白血球やHb、あざ・出血の有無、服薬内容と一緒に確認します。アスピリンなどは血小板の「働き」に影響するため、数だけで安全性を評価できません。"},"mcv":{"mechanism":"MCVは赤血球1個の平均的な体積（大きさ）です。貧血を、赤血球が小さいタイプ・標準程度・大きいタイプに分類するための手がかりになります。","high":"高いMCVはビタミンB12・葉酸不足、飲酒、肝疾患、一部薬剤などでみられます。ただしMCVだけで特定の栄養素不足や病名を確定できません。","low":"低いMCVは鉄欠乏性貧血やサラセミアなどでみられます。Hbが正常でも初期の鉄欠乏などが隠れることがあります。","reading":"Hb・赤血球数・MCH/MCHC、必要に応じてフェリチン、ビタミンB12等と合わせて評価します。栄養補助剤を始める前に原因を確認することが重要です。"},"mch":{"mechanism":"MCHは赤血球1個に平均して含まれるヘモグロビンの「量」です。赤血球の大きさ（MCV）と関連するので、貧血の原因を調べる際に併用します。","high":"MCHが高い場合、赤血球が大きい状態と並行して起こることがありますが、単独の高値だけで病気を判断できません。","low":"低値は赤血球1個のヘモグロビン量が少ないことを意味し、鉄欠乏や赤血球が小さい状態でみられることがあります。","reading":"MCV・MCHC・Hbなどとセットで読みます。MCHが変わっても、酸素を運ぶ能力全体の評価にはHbが重要です。1項目だけを正常化する目的のサプリ使用は適切ではありません。"},"mchc":{"mechanism":"MCHCは赤血球の中でヘモグロビンが占める「濃度」を表します。MCHが1個あたりのヘモグロビン量であるのに対し、MCHCは赤血球の容積に対する濃さを見る違いがあります。","high":"高値は一部の赤血球の形態異常や測定上の影響などでみられます。検査上の要因がないか、ほかの赤血球指数と合わせて確認します。","low":"低値は鉄欠乏など、赤血球内のヘモグロビンが薄い状態を示すことがあります。ただし原因はMCHC単独では決まりません。","reading":"ヘモグロビン・MCV・MCH・赤血球数を一緒に確認します。これらの指標は互いに関連しているため、個別の数値変化を独立した病気の証拠として扱わないことが大切です。"}};
function guideEducationalStatus(name,o,range){
 if(!o)return 'この項目の測定記録はまだありません。一般的な読み方を紹介します。';
 const n=nval(o);
 if(n===null)return '陰性・陽性などの定性結果です。数値の高低ではなく、検査法・症状・服薬を合わせて評価します。';
 if(!range||(range.low===null&&range.high===null))return '登録済みの数値がありますが、施設の基準範囲は未設定です。主治医の治療目標も併せて確認しましょう。';
 return distanceToRange(n,range)===0?'登録された施設基準の範囲内です。ただし個別の治療目標と一致するとは限らず、複数回の変化も重要です。':'登録された施設基準の範囲外です。ただしこれだけで病気や悪化を診断できません。変動要因と過去の推移も確認してください。';
}
function guideLearningPanel(name,info,o,range){
 const d=HEALTH_DETAILS[adviceKey(name)];
 if(!d)return `<div class="learning-intro"><p class="guide-paragraph">${esc(info.about)}</p></div><div class="learning-status">${esc(guideEducationalStatus(name,o,range))}</div><p class="guide-paragraph">この検査の詳しい説明が未登録です。検査機関・医師に項目の意味と解釈方法を確認してください。</p>`;
 const sections=[['🧬','何を測っているの？',d.mechanism],['↗','高い場合に考えること',d.high],['↘','低い場合に考えること',d.low],['📊','正しく読み解くコツ',d.reading]];
 return `<div class="learning-intro"><div class="learning-eyebrow">まずは概要</div><p class="guide-paragraph">${esc(info.about)}</p></div><div class="learning-status"><span class="learning-status-icon">ℹ</span><span>${esc(guideEducationalStatus(name,o,range))}</span></div><div class="learning-hint">▼ 気になる項目をタップすると詳しい説明が開きます</div><div class="learning-accordion">${sections.map(([emoji,title,body],i)=>`<details class="learn-detail" ${i===0?'open':''}><summary><span class="learn-emoji">${emoji}</span><strong>${esc(title)}</strong><span class="learn-chevron" aria-hidden="true">⌄</span></summary><div class="learn-detail-body">${esc(body)}</div></details>`).join('')}</div><p class="learning-footnote">この解説は一般的な医学情報です。検査結果を確定診断するものではありません。</p>`;
}
function adviceKey(name){let n=norm(name);
 if(['hba1c','ヘモグロビンa1c','グリコヘモグロビン'].includes(n))return 'hba1c';
 if(['血糖','空腹時血糖','随時血糖'].includes(n)||n.startsWith('血糖glu'))return 'glucose';
 if(['tg','中性脂肪','中性脂肪tg','トリグリセライド'].includes(n))return 'tg';
 if(['hdl','hdlコレステロール'].includes(n))return 'hdl';
 if(['ldl','ldlコレステロール'].includes(n))return 'ldl';
 if(n==='egfr')return 'egfr';
 if(['cr','クレアチニン','クレアチニンcr','血清クレアチニン'].includes(n))return 'cr';
 if(n.includes('尿アルブミン')||n.includes('uacr'))return 'uacr';
 if(['尿酸','血清尿酸'].includes(n))return 'uric';
 if(['ast','astgot'].includes(n))return 'ast';
 if(['alt','altgpt'].includes(n))return 'alt';
 if(['γgtp','ggtp','gtp'].includes(n))return 'ggtp';
 if(['cpk','ck'].includes(n))return 'cpk';
 if(n==='bmi')return 'bmi';
 if(n==='体重')return 'weight';
 if(n==='腹囲')return 'waist';
 if(n==='身長')return 'height';
 if(['収縮期血圧','最高血圧','sbp'].includes(n))return 'sbp';
 if(['拡張期血圧','最低血圧','dbp'].includes(n))return 'dbp';
 if(n==='尿糖')return 'urineglucose';
 if(n==='尿蛋白')return 'urineprotein';
 if(n==='白血球'||n==='wbc')return 'wbc';
 if(n==='赤血球'||n==='rbc')return 'rbc';
 if(['hb','ヘモグロビン','血色素量','血色素量ヘモグロビン値'].includes(n))return 'hb';
 if(n==='ヘマトクリット'||n==='hct')return 'hct';
 if(n==='血小板'||n==='plt')return 'plt';
 if(n==='mcv')return 'mcv';if(n==='mch')return 'mch';if(n==='mchc')return 'mchc';
 return '';
}
let lastGuideFocus=null,guideMarker='',guideAdvice='';
function localDay(){let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function guideProgressKey(name){return localDay()+':'+adviceKey(name)}
function guideChecksFor(name,count){let rows=state.data.ui_preferences?.guideActivity?.[guideProgressKey(name)]||[];return Array.from({length:count},(_,i)=>Boolean(rows[i]))}
function setGuidePanel(which){el('guideBody').querySelectorAll('[data-guide-pane]').forEach(p=>{p.hidden=p.dataset.guidePane!==which});el('guideBody').querySelectorAll('[data-guide-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.guideTab===which)))}
function updateGuideProgress(){let checks=[...el('guideBody').querySelectorAll('[data-guide-check]')],count=checks.filter(i=>i.checked).length,total=checks.length;let text=el('guideProgressCount'),bar=el('guideProgressFill');if(text)text.textContent=count+' / '+total+' 件';if(bar)bar.style.width=(total?100*count/total:0)+'%';}
async function storeGuideChecks(){try{let x=workingCopy(),p=x.ui_preferences||{},g={...(p.guideActivity||{})},arr=[...el('guideBody').querySelectorAll('[data-guide-check]')].map(n=>n.checked);g[guideProgressKey(guideMarker)]=arr;p.guideActivity=g;x.ui_preferences=p;await save(x);updateGuideProgress()}catch(e){showError(e)}}
function openGuide(name){
 let info=HEALTH_ADVICE[adviceKey(name)]||{about:'この項目は検査方法・単位・症状・他の項目との組み合わせで意味が変わります。数値を無理に変えることを目標にしないでください。',actions:['検査票の基準範囲を確認する。','数値と同時に体調や服薬を記録する。','気になる変化は主治医に相談する。'],review:'改善方法や数値の意味は担当医と確認してください。'};
 let o=latest(name),range=rangeFor(name,o),numeric=o?nval(o):null,rangeState='';guideMarker=name;guideAdvice=info;
 if(range&&numeric!==null&&(range.low!==null||range.high!==null))rangeState=distanceToRange(numeric,range)===0?'登録された基準範囲内です':'登録された基準範囲外です（治療目標とは異なる場合があります）';
