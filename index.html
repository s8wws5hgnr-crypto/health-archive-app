</style></head><body><main class="shell"><header class="app-header"><div class="brand-group"><div id="brandIcon" class="brand-icon" aria-hidden="true">♥</div><div><div class="eyebrow">YOUR HEALTH, IN FOCUS</div><h1>Health Archive<span class="brand-dot">.</span></h1></div></div><div id="headerStatus" class="header-status">● LOCAL</div></header><div class="header-subtitle">データを見つめ、変化をつかむ。</div><div id="alert"></div><div id="view"></div></main><nav id="nav" class="nav"></nav><div id="toast"></div><script>
'use strict';
const el=id=>document.getElementById(id);
const esc=x=>String(x===null||x===undefined?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blank=()=>({app:'Health Archive',schema_version:'0.2',observations:[],medication_periods:[],findings:[],imaging_studies:[],health_events:[],documents:[],encounters:[],marker_definitions:[],interpretations:[],audit_logs:[],range_profiles:[],settings:[]});
const tabs=[['home','⌂','ホーム'],['trends','⌁','推移'],['history','▤','履歴'],['meds','✚','薬歴'],['settings','⚙','設定']];
const state={tab:'home',data:blank(),marker:'',search:'',editing:null,profileMarker:'',errors:[]};let db;
function norm(x){return String(x||'').toLowerCase().replace(/[\s_　％%・（）()\-]/g,'')}
function canonical(x){let k=norm(x);if(['hba1c','ヘモグロビンa1c','グリコヘモグロビン'].includes(k))return 'HbA1c';if(k==='egfr')return 'eGFR';if(['ldl','ldlc','ldlコレステロール'].includes(k))return 'LDL';if(['cpk','ck','クレアチンキナーゼ'].includes(k))return 'CPK';return String(x||'')}
function obs(){return Array.isArray(state.data.observations)?state.data.observations:[]}
function nval(o){let x=o.numeric_value;return typeof x==='number'&&Number.isFinite(x)?x:(typeof x==='string'&&x.trim()!==''&&Number.isFinite(Number(x))?Number(x):null)}
function value(o){return o.raw_text!==null&&o.raw_text!==undefined&&o.raw_text!==''?o.raw_text:(o.categorical_value??o.numeric_value??'—')}
function showError(e){let msg=String(e&&e.message?e.message:e);state.errors.push(msg);el('alert').innerHTML='<div class="banner error">エラー：'+esc(msg)+'</div>';notify('エラーが発生しました')}
function notify(t){let a=el('toast');a.textContent=t;a.style.display='block';setTimeout(()=>a.style.display='none',2600)}
function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open('health-archive-v04',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('store'))r.result.createObjectStore('store')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function dbRead(){return new Promise((resolve,reject)=>{let r=db.transaction('store','readonly').objectStore('store').get('data');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function dbWrite(x){return new Promise((resolve,reject)=>{let t=db.transaction('store','readwrite');t.objectStore('store').put(x,'data');t.oncomplete=resolve;t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error)})}
function validate(x){if(!x||!Array.isArray(x.observations))throw Error('observations配列がありません');for(let i=0;i<x.observations.length;i++){let o=x.observations[i];if(!o||!o.marker_id)throw Error((i+1)+'件目の項目名がありません');if(o.date!==null&&o.date!==undefined&&o.date!==''&&!/^\d{4}-\d{2}-\d{2}$/.test(o.date))throw Error((i+1)+'件目の日付形式が不正です')}return {...blank(),...x,observations:x.observations,medication_periods:Array.isArray(x.medication_periods)?x.medication_periods:[],findings:Array.isArray(x.findings)?x.findings:[],audit_logs:Array.isArray(x.audit_logs)?x.audit_logs:[],range_profiles:Array.isArray(x.range_profiles)?x.range_profiles:[]}}
async function save(x){let d=validate(x);await dbWrite(d);state.data=d}
const PALETTES={mint:{label:'ミント',main:'#65dfc7',soft:'rgba(101,223,199,.15)'},ocean:{label:'ブルー',main:'#7eb8ff',soft:'rgba(126,184,255,.15)'},violet:{label:'パープル',main:'#b6a0ff',soft:'rgba(182,160,255,.16)'},sunset:{label:'コーラル',main:'#ffad9b',soft:'rgba(255,173,155,.17)'},amber:{label:'アンバー',main:'#ffd27c',soft:'rgba(255,210,124,.15)'}};
const ICONS={pulse:{name:'パルス',symbol:'♥'},drop:{name:'ドロップ',symbol:'◆'},leaf:{name:'リーフ',symbol:'✦'},shield:{name:'シールド',symbol:'✚'}};
function uiPrefs(){let p=state.data?.ui_preferences;return {palette:PALETTES[p?.palette]?p.palette:'mint',icon:ICONS[p?.icon]?p.icon:'pulse'}}
function applyAppearance(){let p=uiPrefs(),c=PALETTES[p.palette];document.documentElement.style.setProperty('--accent',c.main);document.documentElement.style.setProperty('--accent-soft',c.soft);el('brandIcon').textContent=ICONS[p.icon].symbol;let m=document.querySelector('meta[name="theme-color"]');if(m)m.content='#091323';let fav=document.querySelector('link[rel="icon"]');if(fav)fav.href='./icon-'+p.icon+'.png'}
async function updateAppearance(part){let x=JSON.parse(JSON.stringify(state.data));x.ui_preferences={...uiPrefs(),...part};await save(x);applyAppearance();render();notify('表示設定を保存しました')}
function rangeShort(name,o){let r=rangeFor(name,o);if(!r)return '基準値：未登録';let a=r.low!==null&&r.high!==null?fmt(r.low)+'〜'+fmt(r.high):r.low!==null?fmt(r.low)+'以上':r.high!==null?fmt(r.high)+'以下':r.text||'要確認';return '基準値：'+a+(r.unit?' '+r.unit:'')}
function compactTrend(name){let t=trendFor(name);return t}
function cardDelta(name){let a=dateObs(name);if(a.length<2)return '比較できる前回値なし';let now=a[a.length-1],prev=a[a.length-2];if(now.unit&&prev.unit&&now.unit!==prev.unit)return '単位が異なるため比較不可';let d=nval(now)-nval(prev);return `前回 ${fmt(nval(prev))} → ${fmt(nval(now))}（${d>0?'+':''}${fmt(d)}）`}
const nnumber=x=>x===null||x===undefined||String(x).trim()===''?null:(Number.isFinite(Number(x))?Number(x):null);
function dateObs(name){return obs().filter(o=>canonical(o.marker_id)===name&&o.date&&nval(o)!==null).sort((a,b)=>String(a.date).localeCompare(String(b.date)))}
function fmt(n){if(n===null||n===undefined)return '—';return Number(n).toLocaleString('ja-JP',{maximumFractionDigits:3})}
function fmtObservation(o){let raw=String(o?.raw_text||'').trim();return /^[-+]?(?:\d+\.?\d*|\.\d+)$/.test(raw)&&Number(raw)===nval(o)?raw:fmt(nval(o))}
function rangeFromObservation(o){if(!o)return null;const lo=nnumber(o.reference_low),hi=nnumber(o.reference_high),txt=String(o.reference_text||'').trim();if(lo!==null||hi!==null||txt)return {low:lo,high:hi,text:txt,unit:o.unit||'',facility:'',source:'検査票記載（要照合）'};return null}
function rangeFor(name,o){let direct=rangeFromObservation(o);if(direct)return direct;let p=(state.data.range_profiles||[]).find(x=>canonical(x.marker_id)===canonical(name));if(!p)return null;const low=nnumber(p.reference_low),high=nnumber(p.reference_high),text=String(p.reference_text||'').trim();if(low===null&&high===null&&!text)return null;return {low,high,text,unit:p.unit||o?.unit||'',facility:p.facility||'',source:'手動登録'} }
function rangeLabel(r){if(!r)return '未登録';let numeric=r.low!==null&&r.high!==null?`${fmt(r.low)}〜${fmt(r.high)}`:r.low!==null?`${fmt(r.low)}以上`:r.high!==null?`${fmt(r.high)}以下`:'';return `${r.text||numeric}${r.unit?' '+r.unit:''}`}
function distanceToRange(x,r){return (r.low!==null&&x<r.low)?r.low-x:(r.high!==null&&x>r.high)?x-r.high:0}
function trendFor(name){const records=dateObs(name);if(!records.length)return {cls:'tag-neutral',label:'判定データなし',delta:'記録なし'};
 const o=records[records.length-1],p=records.length>1?records[records.length-2]:null,r=rangeFor(name,o),now=nval(o);
 const hasRange=!!(r&&(r.low!==null||r.high!==null));
 const inRange=hasRange&&distanceToRange(now,r)===0;
 if(!p)return {cls:inRange?'tag-good':'tag-neutral',label:inRange?'✓ 基準範囲内':'前回データなし',delta:'比較できる前回値なし'};
 const prev=nval(p);if(o.unit&&p.unit&&o.unit!==p.unit)return {cls:inRange?'tag-good':'tag-neutral',label:inRange?'✓ 基準範囲内':'単位不一致',delta:'前回値と単位が異なります'};
 const change=now-prev,delta=`前回 ${fmt(prev)} → ${fmt(now)}（${change>0?'+':''}${fmt(change)}${o.unit||''}）`;
 if(inRange){let wasOutside=distanceToRange(prev,r)>0;return {cls:'tag-good',label:wasOutside?'↗ 基準範囲へ改善':'✓ 基準範囲内',delta}}
 if(hasRange){const old=distanceToRange(prev,r),next=distanceToRange(now,r);if(old>0&&next<old)return {cls:'tag-good',label:'↗ 基準範囲へ接近',delta};if(next>old)return {cls:'tag-bad',label:'↘ 基準範囲から離れる',delta};return {cls:'tag-neutral',label:'→ 範囲外・変化小',delta}}
 return {cls:'tag-neutral',label:change>0?'↑ 上昇（評価保留）':change<0?'↓ 低下（評価保留）':'→ 横ばい',delta}
}
function rangeTitle(name,o){let r=rangeFor(name,o);if(!r)return '病院基準：未登録（設定から入力）';return `病院基準：${rangeLabel(r)} ／ ${r.source}${r.facility?'・'+r.facility:''}`}
function latest(name){return obs().filter(o=>canonical(o.marker_id)===name&&o.date).sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0]}

function settings(){el('view').innerHTML=`<h2>データ管理</h2><div class="card"><div class="label">保存中の検査結果</div><div class="metric">${obs().length}件</div><div class="toolbar"><button id="export" class="btn primary">JSONバックアップ</button><button id="import" class="btn">JSON読み込み</button><input id="file" class="hidden" type="file" accept=".json,application/json"></div><div class="notice">読み込みは既存データを置き換えます。バックアップ後に実行してください。</div></div><h2>病院の基準範囲</h2><div class="card"><p class="notice">病院の検査票に記載された基準値を手動登録してください。最新の検査記録に基準値がある場合は、そちらを優先します。値は医療機関・測定法によって異なります。</p><div class="field"><label>検査項目</label><select id="profileMarker">${[...new Set(obs().map(o=>canonical(o.marker_id)))].sort((a,b)=>a.localeCompare(b,'ja')).map(m=>`<option value="${esc(m)}" ${m===state.profileMarker?'selected':''}>${esc(m)}</option>`).join('')}</select></div><div class="field"><label>病院名（任意・表示用）</label><input id="facility" placeholder="例：通院先の医療機関"></div><div class="two"><div class="field"><label>基準下限（任意）</label><input id="profileLow" inputmode="decimal" placeholder="下限"></div><div class="field"><label>基準上限（任意）</label><input id="profileHigh" inputmode="decimal" placeholder="上限"></div></div><div class="field"><label>基準範囲の原文（任意）</label><input id="profileText" placeholder="例：判定コメント"></div><div class="toolbar"><button id="saveProfile" class="btn primary">この項目の基準値を保存</button><button id="removeProfile" class="btn">基準値を消去</button></div><div id="profilePreview" class="range-caption"></div></div><h2>外観カスタマイズ</h2><div class="card"><div class="label" style="margin-bottom:12px">テーマカラー</div><div class="palette-grid" id="paletteGrid">${Object.entries(PALETTES).map(([k,p])=>`<button type="button" data-palette="${k}" class="palette-option ${uiPrefs().palette===k?'selected':''}" aria-label="${p.label}"><span class="color-dot" style="background:${p.main}"></span><span>${p.label}</span></button>`).join('')}</div><hr class="section-divider"><div class="label" style="margin-bottom:12px">アプリアイコン</div><div class="icon-grid" id="iconGrid">${Object.entries(ICONS).map(([k,p])=>`<button type="button" data-icon="${k}" class="icon-option ${uiPrefs().icon===k?'selected':''}"><img src="./icon-${k}.png" class="icon-preview" alt="${p.name}"><span>${p.name}</span></button>`).join('')}</div><p class="intro">選択するとアプリ内のアイコンが変わります。iPhoneホーム画面のアイコンはiOSの仕様により自動では変わりません。変更する場合は先にJSONをバックアップし、希望のアイコン用ページからホーム画面に追加してください。元のアイコンはデータの復元確認まで削除しないでください。</p><div class="toolbar"><a class="btn" href="./install-pulse.html" target="_blank" rel="noopener">♥ パルスで追加</a><a class="btn" href="./install-drop.html" target="_blank" rel="noopener">◆ ドロップで追加</a><a class="btn" href="./install-leaf.html" target="_blank" rel="noopener">✦ リーフで追加</a><a class="btn" href="./install-shield.html" target="_blank" rel="noopener">✚ シールドで追加</a></div><div class="form-note">追加用ページはSafariで開いて「共有 → ホーム画面に追加」。既存のホーム画面アプリとは保存領域が異なる場合があります。</div></div><h2>診断情報</h2><div class="card small">バージョン：0.10<br>データ件数：${obs().length}<br>接続：${navigator.onLine?'オンライン':'オフライン'}<br>表示モード：${window.matchMedia('(display-mode: standalone)').matches?'ホーム画面アプリ':'Safari等'}<br>直近のエラー：${esc(state.errors.slice(-1)[0]||'なし')}<div class="toolbar"><button id="verify" class="btn">保存件数を確認</button></div></div><div class="banner">個人の検査JSONを公開GitHubへアップロードしないでください。iCloud Drive等へ定期的にバックアップしてください。</div>`;el('export').onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify(state.data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='health-archive-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),15000)};el('import').onclick=()=>el('file').click();el('file').onchange=async e=>{try{let f=e.target.files?.[0];if(!f)return;let x=validate(JSON.parse(await f.text()));if(!confirm(x.observations.length+'件を読み込みます。現在のデータを置き換えてよいですか？'))return;await save(x);state.marker='';state.search='';render();el('alert').innerHTML='<div class="banner">読み込み成功：'+obs().length+'件</div>';notify('読み込み成功')}catch(err){showError(err)}};el('verify').onclick=async()=>{try{let x=await dbRead();notify('保存件数：'+(x?.observations?.length??0)+'件')}catch(e){showError(e)}};let m=el('profileMarker');function fillProfile(){let p=(state.data.range_profiles||[]).find(x=>canonical(x.marker_id)===m.value);el('facility').value=p?.facility||'';el('profileLow').value=p?.reference_low??'';el('profileHigh').value=p?.reference_high??'';el('profileText').value=p?.reference_text||'';let r=rangeFor(m.value,latest(m.value));el('profilePreview').textContent='表示中の基準値：'+(r?rangeLabel(r)+'（'+r.source+'）':'未登録')}m.onchange=()=>{state.profileMarker=m.value;fillProfile()};if(!state.profileMarker)state.profileMarker=m.value;fillProfile();el('saveProfile').onclick=async()=>{try{let k=m.value,ls=el('profileLow').value.trim(),hs=el('profileHigh').value.trim(),lo=nnumber(ls),hi=nnumber(hs),rt=el('profileText').value.trim();if(!k)throw Error('先に検査データを読み込んでください');if((ls&&lo===null)||(hs&&hi===null))throw Error('基準値は数字で入力してください');if(lo===null&&hi===null&&!rt)throw Error('基準値または原文を入力してください');if(lo!==null&&hi!==null&&lo>hi)throw Error('基準下限は上限以下にしてください');let x=JSON.parse(JSON.stringify(state.data));x.range_profiles=(x.range_profiles||[]).filter(p=>canonical(p.marker_id)!==k);x.range_profiles.push({marker_id:k,facility:el('facility').value.trim(),reference_low:lo,reference_high:hi,reference_text:rt||null,unit:latest(k)?.unit||'',updated_at:new Date().toISOString(),source:'manual'});await save(x);render();notify('基準値を保存しました')}catch(e){showError(e)}};el('removeProfile').onclick=async()=>{try{if(!confirm('この項目の手動基準値を消去しますか？'))return;let x=JSON.parse(JSON.stringify(state.data));x.range_profiles=(x.range_profiles||[]).filter(p=>canonical(p.marker_id)!==m.value);await save(x);render();notify('基準値を消去しました')}catch(e){showError(e)}};el('view').querySelectorAll('[data-palette]').forEach(b=>b.onclick=()=>updateAppearance({palette:b.dataset.palette}).catch(showError));el('view').querySelectorAll('[data-icon]').forEach(b=>b.onclick=()=>updateAppearance({icon:b.dataset.icon}).catch(showError))}
(async()=>{try{db=await openDB();let x=await dbRead();state.data=x?validate(x):blank();if(!x)await dbWrite(state.data);render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(e=>console.warn(e))}catch(e){showError(e);el('view').innerHTML='<div class="banner error">初期化できませんでした。再読み込みしてください。</div>'}})();
</script></body></html>
