</style></head><body><main class="shell"><div class="eyebrow">PERSONAL HEALTH INTELLIGENCE</div><h1>Health Archive <span style="color:#68e0ca">●</span></h1><div class="muted">あなたの健康記録をiPhone内に保存</div><div class="banner">v0.9 · アプリ本体に健康データは含みません。設定から検査結果と病院の基準範囲を管理できます。原本未照合データは医療判断に利用しないでください。</div><div id="alert"></div><div id="view"></div></main><nav id="nav" class="nav"></nav><div id="toast"></div><script>
'use strict';
const el=id=>document.getElementById(id);
const esc=x=>String(x===null||x===undefined?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blank=()=>({app:'Health Archive',schema_version:'0.2',observations:[],medication_periods:[],findings:[],imaging_studies:[],health_events:[],documents:[],encounters:[],marker_definitions:[],interpretations:[],audit_logs:[],range_profiles:[],settings:[]});
const tabs=[['home','⌂','ホーム'],['trends','⌁','推移'],['history','▤','履歴'],['meds','✚','薬歴'],['settings','⚙','設定']];
const state={tab:'home',data:blank(),marker:'',search:'',editing:null,profileMarker:'',errors:[]};let db;
function norm(x){return String(x||'').toLowerCase().replace(/[\s_　％%・（）()\-]/g,'')}

function showError(e){let msg=String(e&&e.message?e.message:e);state.errors.push(msg);el('alert').innerHTML='<div class="banner error">エラー：'+esc(msg)+'</div>';notify('エラーが発生しました')}

function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open('health-archive-v04',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('store'))r.result.createObjectStore('store')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}

function dbWrite(x){return new Promise((resolve,reject)=>{let t=db.transaction('store','readwrite');t.objectStore('store').put(x,'data');t.oncomplete=resolve;t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error)})}
function validate(x){if(!x||!Array.isArray(x.observations))throw Error('observations配列がありません');for(let i=0;i<x.observations.length;i++){let o=x.observations[i];if(!o||!o.marker_id)throw Error((i+1)+'件目の項目名がありません');if(o.date!==null&&o.date!==undefined&&o.date!==''&&!/^\d{4}-\d{2}-\d{2}$/.test(o.date))throw Error((i+1)+'件目の日付形式が不正です')}return {...blank(),...x,observations:x.observations,medication_periods:Array.isArray(x.medication_periods)?x.medication_periods:[],findings:Array.isArray(x.findings)?x.findings:[],audit_logs:Array.isArray(x.audit_logs)?x.audit_logs:[],range_profiles:Array.isArray(x.range_profiles)?x.range_profiles:[]}}

const nnumber=x=>x===null||x===undefined||String(x).trim()===''?null:(Number.isFinite(Number(x))?Number(x):null);
function dateObs(name){return obs().filter(o=>canonical(o.marker_id)===name&&o.date&&nval(o)!==null).sort((a,b)=>String(a.date).localeCompare(String(b.date)))}
function fmt(n){if(n===null||n===undefined)return '—';return Number(n).toLocaleString('ja-JP',{maximumFractionDigits:3})}
function fmtObservation(o){let raw=String(o?.raw_text||'').trim();return /^[-+]?(?:\d+\.?\d*|\.\d+)$/.test(raw)&&Number(raw)===nval(o)?raw:fmt(nval(o))}
function rangeFromObservation(o){if(!o)return null;const lo=nnumber(o.reference_low),hi=nnumber(o.reference_high),txt=String(o.reference_text||'').trim();if(lo!==null||hi!==null||txt)return {low:lo,high:hi,text:txt,unit:o.unit||'',facility:'',source:'検査票記載（要照合）'};return null}
function rangeFor(name,o){let direct=rangeFromObservation(o);if(direct)return direct;let p=(state.data.range_profiles||[]).find(x=>canonical(x.marker_id)===canonical(name));if(!p)return null;const low=nnumber(p.reference_low),high=nnumber(p.reference_high),text=String(p.reference_text||'').trim();if(low===null&&high===null&&!text)return null;return {low,high,text,unit:p.unit||o?.unit||'',facility:p.facility||'',source:'手動登録'} }

if(r&&(r.low!==null||r.high!==null)){let d0=distanceToRange(prev,r),d1=distanceToRange(now,r);if(d0>0&&d1===0)return {cls:'tag-good',label:'↗ 基準範囲へ改善方向',delta};if(d0===0&&d1>0)return {cls:'tag-bad',label:'↘ 基準範囲から逸脱',delta};if(d0>0&&d1>0&&d1<d0)return {cls:'tag-good',label:'↗ 基準範囲に近づく',delta};if(d0>0&&d1>0&&d1>d0)return {cls:'tag-bad',label:'↘ 基準範囲から離れる',delta};if(d0===0&&d1===0)return {cls:'tag-neutral',label:'● 基準範囲内',delta};return {cls:'tag-neutral',label:'→ 横ばい',delta}}

function latest(name){return obs().filter(o=>canonical(o.marker_id)===name&&o.date).sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0]}
function line(o,editable){return `<div class="item"><div style="min-width:0"><strong>${esc(canonical(o.marker_id))}</strong><div class="date">${esc(o.date||'日付未確認')} · ${esc(o.verification_status==='verified'?'原本確認済み':'未照合／手入力')}</div></div><div class="value">${esc(value(o))}<div class="date">${esc(o.unit||'')}</div>${editable?`<div class="toolbar" style="justify-content:flex-end"><button class="btn" data-edit="${esc(o.id)}">編集</button><button class="btn danger" data-delete="${esc(o.id)}">削除</button></div>`:''}</div></div>`}
function render(){try{el('alert').innerHTML='';el('nav').innerHTML=tabs.map(([id,ic,label])=>`<button data-tab="${id}" class="${state.tab===id?'active':''}"><div style="font-size:22px">${ic}</div>${label}</button>`).join('');el('nav').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});if(state.tab==='home')home();if(state.tab==='trends')trends();if(state.tab==='history')history();if(state.tab==='meds')meds();if(state.tab==='settings')settings()}catch(e){showError(e)}}
function home(){let recent=obs().slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).slice(0,8);el('view').innerHTML=`<h2>最新の指標 <span class="pill">${obs().length}件</span></h2><div class="grid">${['HbA1c','eGFR','LDL','CPK'].map(m=>{let o=latest(m),r=rangeFor(m,o),t=trendFor(m);return `<div class="card"><div class="label">${esc(m)}</div><div class="metric">${esc(o?value(o):'—')}</div><div class="date">${esc(o?.unit||'')} · ${esc(o?.date||'記録なし')}</div><div class="range-caption">${esc(rangeTitle(m,o))}</div><div class="tag ${t.cls}">${esc(t.label)}</div><div class="delta">${esc(t.delta)}</div></div>`}).join('')}</div><p class="notice">改善方向・悪化方向は登録された基準範囲からの距離に基づく表示で、医学的な診断ではありません。範囲が未登録の場合は増減だけを表示します。</p><h2>最近の検査結果</h2><div class="list">${recent.map(o=>line(o,false)).join('')||'<div class="empty">検査データがありません</div>'}</div><div class="notice">日付未確認の記録は履歴に表示し、最新値・推移グラフからは除外します。</div>`}
function trends(){let markers=[...new Set(obs().map(o=>canonical(o.marker_id)))].sort((a,b)=>a.localeCompare(b,'ja'));if(!markers.includes(state.marker))state.marker=markers.includes('HbA1c')?'HbA1c':(markers[0]||'');let a=dateObs(state.marker),graph='<div class="empty">日付付き数値データがありません</div>',current=a[a.length-1],r=rangeFor(state.marker,current);if(a.length){let ys=a.map(nval),min=Math.min(...ys),max=Math.max(...ys),span=max-min||Math.max(Math.abs(max)*.1,1),pad=Math.max(span*.20,.12),lo=min-pad,hi=max+pad;if(r){if(r.low!==null&&r.low>=lo-pad&&r.low<=hi+pad)lo=Math.min(lo,r.low-pad*.5);if(r.high!==null&&r.high>=lo-pad&&r.high<=hi+pad)hi=Math.max(hi,r.high+pad*.5)}let w=Math.max(380,72*a.length+90),h=266,left=52,right=w-25,top=43,bottom=202,plotH=bottom-top,px=i=>left+(right-left)*(a.length===1?.5:i/(a.length-1)),py=y=>bottom-(y-lo)/(hi-lo)*plotH;

let rangeLines='';if(r){for(let [k,v] of [['下限',r.low],['上限',r.high]]){if(v!==null&&v>=lo&&v<=hi){let y=py(v);rangeLines+=`<line x1="${left}" y1="${y}" x2="${right}" y2="${y}" stroke="#d0bc75" stroke-width="1.2" stroke-dasharray="6 4"/><text x="${right}" y="${y-5}" text-anchor="end" fill="#d7c27e" font-size="10">${k} ${esc(fmt(v))}</text>`}}}

let t=trendFor(state.marker);el('view').innerHTML=`<h2>検査値の推移</h2><div class="field"><label>検査項目</label><select id="marker">${markers.map(m=>`<option value="${esc(m)}" ${m===state.marker?'selected':''}>${esc(m)}</option>`).join('')}</select></div><div class="card">${graph}<div class="legend">● 各点の数字＝測定値 ／ 横軸＝検査日 ／ 点線＝登録済み基準値。横スクロールで過去のデータを確認できます。</div><div class="range-caption">${esc(rangeTitle(state.marker,current))}</div><div class="tag ${t.cls}">${esc(t.label)}</div><div class="delta">${esc(t.delta)}</div><div class="muted" style="margin-top:8px">日付付き数値データ ${a.length}件（全記録 ${obs().filter(o=>canonical(o.marker_id)===state.marker).length}件）</div></div><h2>測定履歴</h2><div class="list">${a.slice().reverse().map(o=>line(o,false)).join('')}</div>`;if(el('marker'))el('marker').onchange=e=>{state.marker=e.target.value;render()};let scroll=el('view').querySelector('.chart-scroller');if(scroll)requestAnimationFrame(()=>{scroll.scrollLeft=scroll.scrollWidth})}
function history(){let a=obs().filter(o=>(String(o.marker_id)+' '+String(o.date)).toLowerCase().includes(state.search.toLowerCase())).sort((x,y)=>String(y.date).localeCompare(String(x.date)));el('view').innerHTML=`<h2>検査履歴</h2><input id="search" placeholder="検査項目・日付で検索" value="${esc(state.search)}"><div class="toolbar"><button id="add" class="btn primary">＋ 新規登録</button></div><div id="form" class="card hidden"><h2 id="formTitle">検査結果を登録</h2><div class="field"><label>検査日</label><input id="date" type="date"></div><div class="field"><label>項目</label><input id="name" placeholder="HbA1c"></div><div class="two"><div class="field"><label>結果</label><input id="result" placeholder="6.0"></div><div class="field"><label>単位</label><input id="unit" placeholder="%"></div></div><div class="two"><div class="field"><label>検査票の基準下限（任意）</label><input id="rangeLow" inputmode="decimal" placeholder="例：4.6"></div><div class="field"><label>検査票の基準上限（任意）</label><input id="rangeHigh" inputmode="decimal" placeholder="例：6.2"></div></div><div class="field"><label>検査票の基準値・注記（任意）</label><input id="rangeText" placeholder="例：判定区分など"></div><div class="toolbar"><button id="save" class="btn primary">保存</button><button id="cancel" class="btn">キャンセル</button></div></div><p class="muted">${a.length}件 / 全${obs().length}件</p><div class="list">${a.map(o=>line(o,true)).join('')}</div>`;el('search').onchange=e=>{state.search=e.target.value;render()};el('add').onclick=()=>edit(null);el('save').onclick=saveRecord;el('cancel').onclick=()=>el('form').classList.add('hidden');el('view').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));el('view').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>remove(b.dataset.delete))}
function edit(id){state.editing=id;let o=obs().find(x=>String(x.id)===String(id));el('form').classList.remove('hidden');el('formTitle').textContent=o?'検査結果を編集':'検査結果を登録';el('date').value=o?.date||'';el('name').value=o?.marker_id||'';el('result').value=o?String(value(o)):'';el('unit').value=o?.unit||'';el('rangeLow').value=o?.reference_low??'';el('rangeHigh').value=o?.reference_high??'';el('rangeText').value=o?.reference_text??'';el('form').scrollIntoView({block:'nearest'})}
async function saveRecord(){try{let date=el('date').value,name=el('name').value.trim(),raw=el('result').value.trim(),unit=el('unit').value.trim();if(!date||!name||!raw){notify('日付・項目・結果を入力してください');return}let lowStr=el('rangeLow').value.trim(),highStr=el('rangeHigh').value.trim(),low=nnumber(lowStr),high=nnumber(highStr),rangeText=el('rangeText').value.trim();if((lowStr&&low===null)||(highStr&&high===null)){notify('基準値は数字で入力してください');return}if(low!==null&&high!==null&&low>high){notify('基準下限は上限以下にしてください');return}let x=JSON.parse(JSON.stringify(state.data)),i=x.observations.findIndex(o=>String(o.id)===String(state.editing)),prior=i>=0?x.observations[i]:null;let numeric=/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(raw)?Number(raw):null;let record={...(prior||{}),id:prior?.id||('manual-'+Date.now()),date,marker_id:name,raw_text:raw,numeric_value:numeric,categorical_value:numeric===null?raw:null,unit,reference_low:low,reference_high:high,reference_text:rangeText||null,verification_status:'user_entered',source_type:'manual'};if(i<0)x.observations.push(record);else x.observations[i]=record;x.audit_logs.push({at:new Date().toISOString(),action:i<0?'create':'update',id:record.id,previous:prior});await save(x);state.editing=null;render();notify('保存しました')}catch(e){showError(e)}}
async function remove(id){if(!confirm('この検査結果を削除しますか？'))return;try{let x=JSON.parse(JSON.stringify(state.data)),prior=x.observations.find(o=>String(o.id)===String(id));x.observations=x.observations.filter(o=>String(o.id)!==String(id));x.audit_logs.push({at:new Date().toISOString(),action:'delete',id,previous:prior});await save(x);render();notify('削除しました')}catch(e){showError(e)}}
function meds(){let m=state.data.medication_periods||[],f=state.data.findings||[];el('view').innerHTML=`<h2>薬歴</h2><div class="list">${m.map(x=>`<div class="item"><div><strong>${esc(x.drug)}</strong><div class="date">${esc(x.frequency||'')} · ${esc(x.status||'')}</div></div><div class="value">${esc(x.dose??'')} ${esc(x.dose_unit||'')}</div></div>`).join('')||'<div class="empty">記録なし</div>'}</div><h2>画像所見</h2><div class="list">${f.map(x=>`<div class="item"><div><strong>${esc(x.anatomy||x.modality||'所見')}</strong><div class="date">${esc(x.date||'日付未確定')}</div><div class="small">${esc(x.finding_text||'')}</div></div></div>`).join('')||'<div class="empty">記録なし</div>'}</div><p class="notice">薬歴と所見は現時点では閲覧専用です。</p>`}
function settings(){el('view').innerHTML=`<h2>データ管理</h2><div class="card"><div class="label">保存中の検査結果</div><div class="metric">${obs().length}件</div><div class="toolbar"><button id="export" class="btn primary">JSONバックアップ</button><button id="import" class="btn">JSON読み込み</button><input id="file" class="hidden" type="file" accept=".json,application/json"></div><div class="notice">読み込みは既存データを置き換えます。バックアップ後に実行してください。</div></div><h2>病院の基準範囲</h2><div class="card"><p class="notice">病院の検査票に記載された基準値を手動登録してください。最新の検査記録に基準値がある場合は、そちらを優先します。値は医療機関・測定法によって異なります。</p><div class="field"><label>検査項目</label><select id="profileMarker">${[...new Set(obs().map(o=>canonical(o.marker_id)))].sort((a,b)=>a.localeCompare(b,'ja')).map(m=>`<option value="${esc(m)}" ${m===state.profileMarker?'selected':''}>${esc(m)}</option>`).join('')}</select></div><div class="field"><label>病院名（任意・表示用）</label><input id="facility" placeholder="例：通院先の医療機関"></div><div class="two"><div class="field"><label>基準下限（任意）</label><input id="profileLow" inputmode="decimal" placeholder="下限"></div><div class="field"><label>基準上限（任意）</label><input id="profileHigh" inputmode="decimal" placeholder="上限"></div></div><div class="field"><label>基準範囲の原文（任意）</label><input id="profileText" placeholder="例：判定コメント"></div><div class="toolbar"><button id="saveProfile" class="btn primary">この項目の基準値を保存</button><button id="removeProfile" class="btn">基準値を消去</button></div><div id="profilePreview" class="range-caption"></div></div><h2>診断情報</h2><div class="card small">バージョン：0.9<br>データ件数：${obs().length}<br>接続：${navigator.onLine?'オンライン':'オフライン'}<br>表示モード：${window.matchMedia('(display-mode: standalone)').matches?'ホーム画面アプリ':'Safari等'}<br>直近のエラー：${esc(state.errors.slice(-1)[0]||'なし')}<div class="toolbar"><button id="verify" class="btn">保存件数を確認</button></div></div><div class="banner">個人の検査JSONを公開GitHubへアップロードしないでください。iCloud Drive等へ定期的にバックアップしてください。</div>`;el('export').onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify(state.data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='health-archive-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),15000)};el('import').onclick=()=>el('file').click();el('file').onchange=async e=>{try{let f=e.target.files?.[0];if(!f)return;let x=validate(JSON.parse(await f.text()));if(!confirm(x.observations.length+'件を読み込みます。現在のデータを置き換えてよいですか？'))return;await save(x);state.marker='';state.search='';render();el('alert').innerHTML='<div class="banner">読み込み成功：'+obs().length+'件</div>';notify('読み込み成功')}catch(err){showError(err)}};el('verify').onclick=async()=>{try{let x=await dbRead();notify('保存件数：'+(x?.observations?.length??0)+'件')}catch(e){showError(e)}};let m=el('profileMarker');function fillProfile(){let p=(state.data.range_profiles||[]).find(x=>canonical(x.marker_id)===m.value);el('facility').value=p?.facility||'';el('profileLow').value=p?.reference_low??'';el('profileHigh').value=p?.reference_high??'';el('profileText').value=p?.reference_text||'';let r=rangeFor(m.value,latest(m.value));el('profilePreview').textContent='表示中の基準値：'+(r?rangeLabel(r)+'（'+r.source+'）':'未登録')}m.onchange=()=>{state.profileMarker=m.value;fillProfile()};if(!state.profileMarker)state.profileMarker=m.value;fillProfile();el('saveProfile').onclick=async()=>{try{let k=m.value,ls=el('profileLow').value.trim(),hs=el('profileHigh').value.trim(),lo=nnumber(ls),hi=nnumber(hs),rt=el('profileText').value.trim();if(!k)throw Error('先に検査データを読み込んでください');if((ls&&lo===null)||(hs&&hi===null))throw Error('基準値は数字で入力してください');if(lo===null&&hi===null&&!rt)throw Error('基準値または原文を入力してください');if(lo!==null&&hi!==null&&lo>hi)throw Error('基準下限は上限以下にしてください');let x=JSON.parse(JSON.stringify(state.data));x.range_profiles=(x.range_profiles||[]).filter(p=>canonical(p.marker_id)!==k);x.range_profiles.push({marker_id:k,facility:el('facility').value.trim(),reference_low:lo,reference_high:hi,reference_text:rt||null,unit:latest(k)?.unit||'',updated_at:new Date().toISOString(),source:'manual'});await save(x);render();notify('基準値を保存しました')}catch(e){showError(e)}};el('removeProfile').onclick=async()=>{try{if(!confirm('この項目の手動基準値を消去しますか？'))return;let x=JSON.parse(JSON.stringify(state.data));x.range_profiles=(x.range_profiles||[]).filter(p=>canonical(p.marker_id)!==m.value);await save(x);render();notify('基準値を消去しました')}catch(e){showError(e)}}}
(async()=>{try{db=await openDB();let x=await dbRead();state.data=x?validate(x):blank();if(!x)await dbWrite(state.data);render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(e=>console.warn(e))}catch(e){showError(e);el('view').innerHTML='<div class="banner error">初期化できませんでした。再読み込みしてください。</div>'}})();
</script></body></html>
