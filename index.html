<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1324"><link rel="manifest" href="manifest.webmanifest"><title>Health Archive</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#eaf1fc;background:#0b1324;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:760px;margin:auto;padding:28px 18px 105px}.eyebrow{font-size:11px;letter-spacing:.2em;color:#81a3cb;font-weight:700}h1{font-size:31px;letter-spacing:-1px;margin:8px 0 6px}h2{font-size:19px;margin:25px 0 13px}.muted{color:#94a9c6;font-size:13px}.banner{background:#13223a;border:1px solid #29415c;border-radius:15px;padding:12px 14px;margin:18px 0;color:#b9c9dc;font-size:12px;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:linear-gradient(140deg,#17263e,#111d30);border:1px solid #2b3e59;border-radius:20px;padding:17px;min-width:0}.metric{font-size:30px;font-weight:750;letter-spacing:-1px;margin:8px 0}.label{font-size:12px;color:#9db5d1}.date{font-size:11px;color:#7894b4}.good{color:#67dfc6}.warn{color:#f7c67c}.list{display:grid;gap:9px}.item{background:#142139;border:1px solid #293d57;border-radius:14px;padding:13px;display:flex;align-items:center;justify-content:space-between;gap:12px}.item strong{font-size:14px}.value{font-weight:700;white-space:nowrap}.nav{position:fixed;bottom:0;left:0;right:0;background:#101c30ee;backdrop-filter:blur(15px);border-top:1px solid #2b3e59;display:flex;justify-content:center;padding:10px 8px calc(10px + env(safe-area-inset-bottom))}.nav button{background:none;border:0;color:#8ba4c2;min-width:70px;flex:1;max-width:150px;font-size:12px;padding:9px 4px}.nav button.active{color:#6de0d0;font-weight:700}.pill{display:inline-block;background:#193c48;color:#7de5d1;padding:5px 9px;border-radius:99px;font-size:11px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0}.btn{background:#214761;color:#d9f7ff;border:1px solid #3b6984;border-radius:12px;padding:11px 13px;font-size:13px}.btn.primary{background:#46b9ac;color:#071c23;border:0;font-weight:700}.field{display:grid;gap:5px;margin:12px 0}.field label{font-size:12px;color:#a9bfda}input,select{background:#0c1728;color:#e8f0fb;border:1px solid #3a516c;border-radius:10px;padding:11px;width:100%;min-width:0}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chart{width:100%;height:205px;display:block}.empty{padding:25px;text-align:center;color:#9db5d1}.small{font-size:12px}.section-title{display:flex;justify-content:space-between;align-items:center}.scroll{max-height:450px;overflow:auto}.hidden{display:none}#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#294d5b;color:white;padding:10px 18px;border-radius:12px;display:none;z-index:10;max-width:90vw;text-align:center}
</style></head><body><main class="shell"><div class="eyebrow">PERSONAL HEALTH INTELLIGENCE</div><h1>Health Archive <span style="color:#5cddc6">●</span></h1><div class="muted">あなたの検査記録を、ひとつの場所に。</div><div class="banner">検査データは初期状態では空です。「設定」から非公開の初期データJSONを読み込んでください。データは端末内に保存されます。</div><div id="view"></div></main><nav class="nav" id="nav"></nav><div id="toast"></div><script>
const tabs=[['home','⌂','ホーム'],['trends','⌁','推移'],['history','▤','履歴'],['meds','✚','薬歴'],['settings','⚙','設定']];let state={tab:'home',data:null,marker:'HbA1c',search:''};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const val=o=>o.raw_text??o.numeric_value??o.categorical_value??'—';
function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open('health-archive-v04',1);r.onupgradeneeded=()=>r.result.createObjectStore('store');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}let db;function get(k){return new Promise((res,rej)=>{let r=db.transaction('store').objectStore('store').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function put(k,v){return new Promise((res,rej)=>{let r=db.transaction('store','readwrite').objectStore('store').put(v,k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function toast(t){let el=document.getElementById('toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',2700)}function latest(m){return [...state.data.observations].filter(o=>o.marker_id===m).sort((a,b)=>b.date.localeCompare(a.date))[0]}function card(m){let o=latest(m);return `<div class="card"><div class="label">${esc(m)}</div><div class="metric">${esc(o?val(o):'—')}</div><div class="date">${esc(o?.unit||'')} · ${esc(o?.date||'記録なし')}</div></div>`}
function render(){document.getElementById('nav').innerHTML=tabs.map(([id,ic,name])=>`<button class="${state.tab===id?'active':''}" data-tab="${id}"><div style="font-size:22px">${ic}</div>${name}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});let v=document.getElementById('view');if(state.tab==='home'){let last=[...state.data.observations].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,7);v.innerHTML=`<h2>最新の指標 <span class="pill">${state.data.observations.length}件の記録</span></h2><div class="grid">${['HbA1c','eGFR','LDL','CPK'].map(card).join('')}</div><h2>最近の検査結果</h2><div class="list">${last.map(row).join('')}</div>`}if(state.tab==='trends')trends(v);if(state.tab==='history')history(v);if(state.tab==='meds')meds(v);if(state.tab==='settings')settings(v)}
function row(o){return `<div class="item"><div><strong>${esc(o.marker_id)}</strong><div class="date">${esc(o.date)} · ${esc(o.verification_status==='verified'?'確認済み':'原本未照合')}</div></div><div class="value">${esc(val(o))} <span class="muted">${esc(o.unit||'')}</span></div></div>`}
function trends(v){let markers=[...new Set(state.data.observations.map(o=>o.marker_id))].sort();let arr=state.data.observations.filter(o=>o.marker_id===state.marker&&Number.isFinite(Number(o.numeric_value))).sort((a,b)=>a.date.localeCompare(b.date));let svg='<div class="empty">数値データがありません</div>';if(arr.length){let values=arr.map(o=>Number(o.numeric_value)),min=Math.min(...values),max=Math.max(...values),pad=(max-min||1)*.2,minY=min-pad,maxY=max+pad;let points=arr.map((o,i)=>`${36+i*(310/Math.max(arr.length-1,1))},${170-(Number(o.numeric_value)-minY)/(maxY-minY)*140}`).join(' ');svg=`<svg class="chart" viewBox="0 0 380 205" role="img" aria-label="${esc(state.marker)}の推移"><line x1="30" y1="170" x2="355" y2="170" stroke="#47617c"/><line x1="30" y1="30" x2="30" y2="170" stroke="#47617c"/><polyline points="${points}" fill="none" stroke="#5fdfc9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${arr.map((o,i)=>`<circle cx="${36+i*(310/Math.max(arr.length-1,1))}" cy="${170-(Number(o.numeric_value)-minY)/(maxY-minY)*140}" r="4" fill="#80f0d9"/>`).join('')}<text x="33" y="22" fill="#abc0d9" font-size="11">${max.toFixed(1)}</text><text x="33" y="191" fill="#abc0d9" font-size="11">${esc(arr[0].date)}</text><text x="270" y="191" fill="#abc0d9" font-size="11">${esc(arr[arr.length-1].date)}</text></svg>`}v.innerHTML=`<h2>検査値の推移</h2><div class="field"><label>検査項目</label><select id="marker">${markers.map(m=>`<option ${m===state.marker?'selected':''}>${esc(m)}</option>`).join('')}</select></div><div class="card">${svg}<div class="muted">${arr.length}件の数値データ · 原本未照合を含みます</div></div><h2>測定履歴</h2><div class="list">${arr.slice().reverse().map(row).join('')}</div>`;document.getElementById('marker').onchange=e=>{state.marker=e.target.value;render()}}
function history(v){let arr=state.data.observations.filter(o=>(o.marker_id+' '+o.date).toLowerCase().includes(state.search.toLowerCase())).sort((a,b)=>b.date.localeCompare(a.date));v.innerHTML=`<h2>検査履歴</h2><input id="search" placeholder="検査項目・日付で検索" value="${esc(state.search)}"><div class="toolbar"><button class="btn primary" id="add">＋ 検査結果を追加</button></div><div id="entry" class="hidden card"><div class="field"><label>検査日</label><input type="date" id="edate"></div><div class="field"><label>検査項目</label><input id="emarker" placeholder="例：HbA1c"></div><div class="two"><div class="field"><label>結果（文字列可）</label><input id="evalue" placeholder="例：6.0"></div><div class="field"><label>単位</label><input id="eunit" placeholder="例：%"></div></div><button class="btn primary" id="save">保存</button></div><p class="muted">${arr.length}件</p><div class="list scroll" id="results">${arr.map(o=>`<div data-id="${esc(o.id)}">${row(o)}</div>`).join('')}</div>`;document.getElementById('search').oninput=e=>{state.search=e.target.value;let items=state.data.observations.filter(o=>(o.marker_id+' '+o.date).toLowerCase().includes(state.search.toLowerCase())).sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('results').innerHTML=items.map(o=>`<div data-id="${esc(o.id)}">${row(o)}</div>`).join('')};document.getElementById('add').onclick=()=>document.getElementById('entry').classList.toggle('hidden');document.getElementById('save').onclick=async()=>{let date=document.getElementById('edate').value,m=document.getElementById('emarker').value.trim(),raw=document.getElementById('evalue').value.trim(),unit=document.getElementById('eunit').value.trim();if(!date||!m||!raw)return toast('日付・項目・結果は必須です');let n=Number(raw);state.data.observations.push({id:'manual-'+Date.now(),date,marker_id:m,raw_text:raw,numeric_value:raw!==''&&Number.isFinite(n)?n:null,unit,verification_status:'user_entered',source_type:'manual'});await put('data',state.data);toast('保存しました');render()}}
function meds(v){v.innerHTML=`<h2>薬歴・治療履歴</h2><div class="list">${state.data.medication_periods.map(m=>`<div class="item"><div><strong>${esc(m.drug)}</strong><div class="date">${esc(m.frequency||'')} · ${esc(m.status||'')}</div></div><div class="value">${esc(m.dose??'')} ${esc(m.dose_unit||'')}</div></div>`).join('')}</div><h2>画像所見・備考</h2><div class="list">${state.data.findings.map(f=>`<div class="item"><div><strong>${esc(f.anatomy||f.modality||'所見')}</strong><div class="date">${esc(f.date||'日付未確定')}</div><div class="small">${esc(f.finding_text||'')}</div></div></div>`).join('')}</div><p class="muted">薬歴と所見は初期データの閲覧版です。追加編集機能は次版で対応予定。</p>`}
function settings(v){v.innerHTML=`<h2>データ管理</h2><div class="card"><div class="label">保存データ</div><div class="metric">${state.data.observations.length} <span style="font-size:14px">件</span></div><div class="muted">ブラウザ内IndexedDBに保存。バックアップは自動ではありません。</div><div class="toolbar"><button class="btn primary" id="export">バックアップを書き出す</button><button class="btn" id="import">JSONから復元</button><input class="hidden" id="file" type="file" accept=".json,application/json"></div></div><h2>注意事項</h2><div class="banner">Safariのサイトデータ削除、端末故障、PWAの削除などでデータが消失する可能性があります。定期的にJSONを「ファイル」アプリのiCloud Drive等に保存してください。バックアップには機微な健康情報が含まれます。</div>`;document.getElementById('export').onclick=()=>{let blob=new Blob([JSON.stringify(state.data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='health-archive-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.getElementById('import').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.observations)||!Array.isArray(d.medication_periods))throw Error('形式が不正です');if(!confirm('現在のデータをバックアップの内容で置き換えます。よろしいですか？'))return;state.data=d;await put('data',d);toast('復元しました');render()}catch(err){toast('復元できません: '+err.message)}}}
(async()=>{try{db=await openDB();state.data=await get('data');if(!state.data){state.data={app:'Health Archive',schema_version:'0.2',observations:[],medication_periods:[],findings:[],imaging_studies:[],health_events:[],documents:[],encounters:[],marker_definitions:[],interpretations:[],audit_logs:[],settings:[]};await put('data',state.data)}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(e){document.getElementById('view').innerHTML='<div class="banner">起動できません。HTTPS配信で開いてください。'+esc(e.message)+'</div>'}})();
</script></body></html>
